<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Renewable electricity share</title>
  <desc id="desc">Bar chart comparing renewable electricity shares in six countries in 2015 and 2025.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="34" fill="#181c23" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Electricity from renewable sources (%)</text>
  <g transform="translate(70 78)" font-family="Inter, Arial, sans-serif">
    <g stroke="#c1c6d7" stroke-width="1">
      <line x1="0" y1="240" x2="590" y2="240"/>
      <line x1="0" y1="180" x2="590" y2="180"/>
      <line x1="0" y1="120" x2="590" y2="120"/>
      <line x1="0" y1="60" x2="590" y2="60"/>
      <line x1="0" y1="0" x2="590" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="240"/>
    </g>
    <g fill="#414755" font-size="13" text-anchor="end">
      <text x="-10" y="244">0</text><text x="-10" y="184">20</text><text x="-10" y="124">40</text><text x="-10" y="64">60</text><text x="-10" y="4">80</text>
    </g>
    <g>
      <rect x="28" y="84" width="22" height="156" fill="#d8e2ff"/><rect x="54" y="48" width="22" height="192" fill="#0058bc"/>
      <rect x="124" y="102" width="22" height="138" fill="#d8e2ff"/><rect x="150" y="72" width="22" height="168" fill="#0058bc"/>
      <rect x="220" y="198" width="22" height="42" fill="#d8e2ff"/><rect x="246" y="150" width="22" height="90" fill="#0058bc"/>
      <rect x="316" y="66" width="22" height="174" fill="#d8e2ff"/><rect x="342" y="42" width="22" height="198" fill="#0058bc"/>
      <rect x="412" y="204" width="22" height="36" fill="#d8e2ff"/><rect x="438" y="162" width="22" height="78" fill="#0058bc"/>
      <rect x="508" y="126" width="22" height="114" fill="#d8e2ff"/><rect x="534" y="78" width="22" height="162" fill="#0058bc"/>
    </g>
    <g fill="#414755" font-size="12" text-anchor="middle">
      <text x="52" y="266">Canada</text><text x="148" y="266">Spain</text><text x="244" y="266">Japan</text>
      <text x="340" y="266">Brazil</text><text x="436" y="266">India</text><text x="532" y="266">Germany</text>
    </g>
    <g fill="#181c23" font-size="13">
      <rect x="410" y="-36" width="14" height="14" fill="#d8e2ff"/><text x="430" y="-24">2015</text>
      <rect x="480" y="-36" width="14" height="14" fill="#0058bc"/><text x="500" y="-24">2025</text>
    </g>
  </g>
</svg>
