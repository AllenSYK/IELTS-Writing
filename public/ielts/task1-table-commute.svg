<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Average daily commuting time</title>
  <desc id="desc">Table comparing average daily commuting time in minutes in five cities in 2010 and 2025.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="42" fill="#181c23" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Average daily commuting time (minutes)</text>
  <g transform="translate(92 82)" font-family="Inter, Arial, sans-serif">
    <rect width="536" height="252" fill="#f6f8ff" stroke="#c1c6d7"/>
    <rect width="536" height="42" fill="#d8e2ff"/>
    <g fill="#181c23" font-size="15" font-weight="700">
      <text x="44" y="27">City</text>
      <text x="270" y="27" text-anchor="middle">2010</text>
      <text x="448" y="27" text-anchor="middle">2025</text>
    </g>
    <g stroke="#c1c6d7">
      <line x1="180" y1="0" x2="180" y2="252"/>
      <line x1="360" y1="0" x2="360" y2="252"/>
      <line x1="0" y1="42" x2="536" y2="42"/>
      <line x1="0" y1="84" x2="536" y2="84"/>
      <line x1="0" y1="126" x2="536" y2="126"/>
      <line x1="0" y1="168" x2="536" y2="168"/>
      <line x1="0" y1="210" x2="536" y2="210"/>
    </g>
    <g fill="#414755" font-size="15">
      <text x="44" y="69">London</text><text x="270" y="69" text-anchor="middle">74</text><text x="448" y="69" text-anchor="middle">68</text>
      <text x="44" y="111">Toronto</text><text x="270" y="111" text-anchor="middle">62</text><text x="448" y="111" text-anchor="middle">71</text>
      <text x="44" y="153">Singapore</text><text x="270" y="153" text-anchor="middle">48</text><text x="448" y="153" text-anchor="middle">43</text>
      <text x="44" y="195">Sydney</text><text x="270" y="195" text-anchor="middle">58</text><text x="448" y="195" text-anchor="middle">64</text>
      <text x="44" y="237">Berlin</text><text x="270" y="237" text-anchor="middle">44</text><text x="448" y="237" text-anchor="middle">39</text>
    </g>
  </g>
</svg>
